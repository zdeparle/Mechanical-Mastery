<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanical Mastery — Interactive Mechanical Engineering</title>
  <meta name="description" content="Learn mechanical engineering through interactive subject guides, calculators, live simulations, and quizzes. Statics, dynamics, materials, thermodynamics, fluids, and heat transfer.">
  <meta name="theme-color" content="#4f46e5">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Mechanical Mastery — Interactive Engineering Learning">
  <meta property="og:description" content="Subject guides, calculators, simulations, and quizzes for mechanical engineering.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mechanical Mastery">
  <meta name="twitter:description" content="Interactive mechanical engineering learning platform.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/main.css">

  <script>
    // Apply saved/system theme before first paint to avoid a flash.
    (function () {
      var saved = localStorage.getItem('mm-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
</head>
<body>
  <a href="#app" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a href="#/" class="logo" aria-label="Mechanical Mastery home">
        <span class="logo-icon" aria-hidden="true">⚙️</span>
        <span>Mechanical Mastery</span>
      </a>
      <ul class="nav-links" id="primary-nav">
        <li><a href="#/learn">Learn</a></li>
        <li><a href="#/tools">Calculators</a></li>
        <li><a href="#/sims">Simulations</a></li>
        <li><a href="#/quiz">Quiz</a></li>
        <li><a href="#/reference">Reference</a></li>
      </ul>
      <div class="nav-actions">
        <button class="icon-btn" id="search-toggle" aria-label="Search (press /)" title="Search (press /)">🔍</button>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-icon-light" aria-hidden="true">🌙</span>
          <span class="theme-icon-dark" aria-hidden="true">☀️</span>
        </button>
        <button class="icon-btn" id="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
      </div>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p style="padding:2rem;text-align:center">Mechanical Mastery is an interactive app and needs JavaScript to run.</p></noscript>
  </main>

  <dialog id="search-dialog" aria-label="Search">
    <input id="search-input" type="search" placeholder="Search subjects, tools, equations…" autocomplete="off">
    <div id="search-results"></div>
  </dialog>

  <footer class="site-footer">
    <p>⚙️ Mechanical Mastery · built for learning, not for stamped engineering design ·
      <a href="https://github.com/zdeparle/Mechanical-Mastery">source</a> · © <span id="year"></span></p>
  </footer>

  <script src="js/physics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/sims.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
