<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statics & Dynamics Test - Mechanical Mastery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .test-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .test-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
        }

        .test-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .test-header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .test-progress {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .progress-bar-container {
            flex: 1;
            min-width: 200px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--bg-light);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            transition: width 0.3s ease;
            border-radius: 6px;
        }

        .question-counter {
            font-weight: 600;
            color: var(--text-color);
            font-size: 1.1rem;
        }

        .question-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 2rem;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .question-category {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--text-color);
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option-item {
            padding: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.05);
            transform: translateX(5px);
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .option-item input[type="radio"] {
            margin-right: 1rem;
            cursor: pointer;
        }

        .option-item label {
            cursor: pointer;
            font-size: 1.05rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            width: 100%;
        }

        .test-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            gap: 1rem;
        }

        .nav-button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-prev {
            background: white;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-prev:hover:not(:disabled) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-next {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            padding: 1.2rem 3rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .results-container {
            display: none;
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            margin-top: 2rem;
        }

        .results-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 1rem 0;
        }

        .score-percentage {
            font-size: 2rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .category-breakdown {
            margin: 2rem 0;
        }

        .category-item {
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 12px;
            border-left: 4px solid;
        }

        .category-item.excellent {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success-color);
        }

        .category-item.good {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary-color);
        }

        .category-item.needs-improvement {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        .category-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .category-score {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .study-recommendations {
            background: var(--bg-light);
            padding: 2rem;
            border-radius: 12px;
            margin-top: 2rem;
        }

        .study-recommendations h3 {
            color: var(--text-color);
            margin-bottom: 1rem;
        }

        .recommendation-list {
            list-style: none;
            padding: 0;
        }

        .recommendation-list li {
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            background: white;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 2rem;
            background: var(--bg-light);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: var(--primary-color);
            color: white;
        }

        @media (max-width: 768px) {
            .test-container {
                padding: 1rem;
            }

            .question-card {
                padding: 1.5rem;
            }

            .test-navigation {
                flex-direction: column;
            }

            .nav-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <span class="logo-icon">⚙️</span>
                <span>Mechanical Mastery</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#concepts">Concepts</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 2rem 0; min-height: calc(100vh - 200px);">
        <div class="test-container">
            <div class="test-header">
                <h1>⚖️ Statics & Dynamics Assessment</h1>
                <p>Test your understanding of forces, moments, and motion in mechanical systems</p>
            </div>

            <div id="test-content">
                <div class="test-progress">
                    <div class="question-counter">
                        Question <span id="current-question">1</span> of <span id="total-questions">30</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill" style="width: 3.33%"></div>
                        </div>
                    </div>
                </div>

                <div id="questions-container"></div>

                <div class="test-navigation">
                    <button class="nav-button btn-prev" id="prev-btn" onclick="previousQuestion()" disabled>Previous</button>
                    <button class="nav-button btn-next" id="next-btn" onclick="nextQuestion()">Next</button>
                    <button class="nav-button btn-submit" id="submit-btn" onclick="submitTest()" style="display: none;">Submit Test</button>
                </div>
            </div>

            <div id="results-container" class="results-container"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Mechanical Mastery. Interactive Engineering Education Platform.</p>
        </div>
    </footer>

    <script src="statics-test.js"></script>
</body>
</html>
